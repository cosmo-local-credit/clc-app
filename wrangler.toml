# Cloudflare Pages project for the mobile PWA. The admin console is a separate
# project — see apps/admin/wrangler.toml.
name = "clc-app"
pages_build_output_dir = "apps/web/dist"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# WARNING: these are Pages Function bindings, delivered at runtime. VITE_ values
# are inlined into the client bundle at *build* time from the build's process
# environment, which on Pages means the project's own environment variables — so
# editing a VITE_ value here does NOT change what the browser gets. Verified in
# apps/admin: a build with one value here and another in .env put the .env value in
# dist/assets and this one only in dist/_worker.js.
#
# Change any VITE_ value in the Pages dashboard as well, or instead.
[vars]
VITE_API_URL = "https://staging.cosmolocal.credit"
VITE_CALIBUR_ADDRESS = "0x1289fE793392fb1a905f78Ea23f632EDD3d15b85"
VITE_CHAIN_ID = "42220"
VITE_DEFAULT_COUNTRY = "KE"
VITE_FULL_REACT_ERRORS = "true"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"
VITE_PAPER_WALLET_ORIGIN = "https://app.cosmolocal.credit"
VITE_PUBLIC_RPC_URL = "https://forno.celo.org"
VITE_RELAYER_URL = "https://staging.cosmolocal.credit/api/v2/relayer"
# The registrable domain, so one passkey works on app.cosmolocal.credit and
# admin.cosmolocal.credit alike. `resolveRelyingPartyId` uses this only when it is
# a suffix of the serving host, so *.pages.dev preview deploys still fall back to
# their own hostname.
#
# CHANGING THIS INVALIDATES EXISTING PASSKEYS. Credentials registered under
# `app.cosmolocal.credit` cannot be re-scoped — WebAuthn has no migration path —
# so anyone who signed up with a passkey before this change has to register a new
# one. Their paper wallet is unaffected. Must match `relayer.relying_party_id` in
# clc-core.
VITE_RELYING_PARTY_ID = "cosmolocal.credit"
VITE_RELYING_PARTY_NAME = "CLC"
