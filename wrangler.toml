# Cloudflare Pages config for the web app. Admin has a separate config at
# apps/admin/wrangler.toml. This file is identical on develop and master: Pages
# picks the block by environment, so production builds master and the preview
# environment builds develop.
name = "clc-app"
pages_build_output_dir = "apps/web/dist"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# Production: master, served at cosmolocal.credit.
[vars]
VITE_API_URL = "https://api.cosmolocal.credit"
VITE_BRAND = "prod"
VITE_FULL_REACT_ERRORS = "false"
VITE_PAPER_WALLET_ORIGIN = "https://app.cosmolocal.credit"
VITE_POOL_OWNERSHIP_TRANSFER_ENABLED = "true"
VITE_RELAYER_URL = "https://api.cosmolocal.credit/api/v2/relayer"
VITE_RELYING_PARTY_ID = "cosmolocal.credit"
VITE_STORAGE_URL = "https://storage.cosmolocal.credit"

# Shared values.
VITE_CHAIN_ID = "100"
VITE_DEFAULT_COUNTRY = "KE"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"
VITE_PUBLIC_RPC_FALLBACK_URLS = "https://gnosis-rpc.publicnode.com"
VITE_PUBLIC_RPC_URL = "https://r1-gnosis.grassecon.org"
VITE_RELYING_PARTY_NAME = "CLC"

# Staging: develop, served at test.cosmolocal.credit. Wrangler vars are
# non-inheritable, so repeat all values in this block.
[env.preview.vars]
VITE_API_URL = "https://gnosis-staging.cosmolocal.credit"
VITE_BRAND = "staging"
VITE_FULL_REACT_ERRORS = "true"
VITE_PAPER_WALLET_ORIGIN = "https://test.cosmolocal.credit"
VITE_POOL_OWNERSHIP_TRANSFER_ENABLED = "true"
VITE_RELAYER_URL = "https://gnosis-staging.cosmolocal.credit/api/v2/relayer"
VITE_RELYING_PARTY_ID = "test.cosmolocal.credit"
VITE_STORAGE_URL = "https://gnosis-storage.cosmolocal.credit"

# Shared values.
VITE_CHAIN_ID = "100"
VITE_DEFAULT_COUNTRY = "KE"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"
VITE_PUBLIC_RPC_FALLBACK_URLS = "https://gnosis-rpc.publicnode.com"
VITE_PUBLIC_RPC_URL = "https://r1-gnosis.grassecon.org"
VITE_RELYING_PARTY_NAME = "CLC"
