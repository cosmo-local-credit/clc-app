codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...90"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

bundle_analysis:
  warning_threshold: "5%"
  status: informational

flags:
  web:
    paths:
      - apps/web/src/
    carryforward: true
  core:
    paths:
      - packages/core/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_bundle_changes: true
