packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@percy/core": true
  canvas: true
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true
catalog:
  # Nitro's Cloudflare Pages worker currently 500s under Vite+ 0.3.0. Keep the
  # CLI and its Vite-compatible core on the last deployment-proven release.
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  oxfmt: "^0.53.0"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
