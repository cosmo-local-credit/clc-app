packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@percy/core": true
  canvas: true
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.9
  vite-plus: latest
  oxfmt: "^0.53.0"
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  oxfmt: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
