# Cloudflare Pages project for the admin console.
#
# A separate project from apps/web on purpose. A Pages project has one build
# output directory, and serving the console from a path on the app's origin would
# put it inside the scope of apps/web's service worker — which must never cache or
# intercept anything here.
#
# The deploy itself is Git-connected and configured in the dashboard:
#   Build command            pnpm --filter @clc/admin build
#   Build output directory   apps/admin/dist
#   Root directory           (repository root)
# This file covers Functions configuration and manual deploys
# (`wrangler pages deploy -c apps/admin/wrangler.toml`); `pages_build_output_dir`
# is relative to this file, and wrangler run from the root without `-c` would pick
# up the web config instead.
name = "clc-admin"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# Only the four variables this app reads. Deliberately not copied from the web
# project: the console has no map, no Calibur wallet and no paper-wallet origin,
# and an unused key here would imply otherwise.
#
# These reach the Pages Function at runtime. VITE_* values are inlined into the
# client bundle at *build* time, so the same four must also be set as environment
# variables on the Pages project — this file alone will not configure the bundle.
[vars]
VITE_API_URL = "https://staging.cosmolocal.credit"
VITE_CHAIN_ID = "42220"
VITE_RELAYER_URL = "https://staging.cosmolocal.credit/api/v2/relayer"
# The registrable domain, not this host. A passkey is bound to the relying party
# it was registered under, so scoping it to the parent is what lets one credential
# work on both app.cosmolocal.credit and admin.cosmolocal.credit. It must match
# `relayer.relying_party_id` in clc-core, and the same value is set for apps/web.
VITE_RELYING_PARTY_ID = "cosmolocal.credit"
