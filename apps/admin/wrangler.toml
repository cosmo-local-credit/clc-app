# Cloudflare Pages config for the admin console. Keep this file: Nitro and Pages
# use it to select the admin project settings.
name = "clc-admin-gnosis"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

[vars]
# Per-environment values; keep in sync with the corresponding master config.
VITE_API_URL = "https://gnosis-staging.cosmolocal.credit"
VITE_BRAND = "staging"
VITE_PAPER_WALLET_ORIGIN = "https://test.cosmolocal.credit"
VITE_RELAYER_URL = "https://gnosis-staging.cosmolocal.credit/api/v2/relayer"
VITE_RELYING_PARTY_ID = "test.cosmolocal.credit"
VITE_STORAGE_URL = "https://gnosis-storage.cosmolocal.credit"

# Shared values.
VITE_CHAIN_ID = "100"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"

# Preview deploys use their pages.dev host as the relying party. Vars are
# non-inheritable, so repeat all values in this block.
[env.preview.vars]
# Per-environment preview values.
VITE_API_URL = "https://gnosis-staging.cosmolocal.credit"
VITE_BRAND = "staging"
VITE_PAPER_WALLET_ORIGIN = "https://test.cosmolocal.credit"
VITE_RELAYER_URL = "https://gnosis-staging.cosmolocal.credit/api/v2/relayer"
VITE_RELYING_PARTY_ID = "clc-admin-gnosis.pages.dev"
VITE_STORAGE_URL = "https://gnosis-storage.cosmolocal.credit"

# Shared preview values.
VITE_CHAIN_ID = "100"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"
