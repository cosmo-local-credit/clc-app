# Cloudflare Pages project for the admin console.
#
# A separate project from apps/web on purpose. A Pages project has one build
# output directory, and serving the console from a path on the app's origin would
# put it inside the scope of apps/web's service worker — which must never cache or
# intercept anything here.
#
# The deploy itself is Git-connected and configured in the dashboard:
#   Build command            pnpm --filter @clc/admin build
#   Build output directory   apps/admin/dist
#   Root directory           (repository root)
#
# THIS FILE IS REQUIRED — it is what separates the two projects. Nitro resolves a
# Wrangler config from the build's working directory, which `pnpm --filter` sets to
# apps/admin. Delete it and the resolution walks up to the root config, which
# generates a deploy named "clc-app" carrying every one of apps/web's vars
# (MapTiler key included). Verified by building with and without it.
#
# It seeds the config the deploy actually uses, which Nitro generates at
# dist/_worker.js/wrangler.json — hence the build-time warning that
# `pages_build_output_dir` is overridden and ignored. That key is kept anyway
# because Wrangler requires it in a Pages config, and a manual
# `wrangler pages deploy -c apps/admin/wrangler.toml` reads it relative to here.
name = "clc-admin"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# No [vars] here on purpose.
#
# `vars` are Pages Function bindings, delivered at *runtime*. Every value this app
# reads is a VITE_ variable, and those are inlined into the client bundle at *build*
# time from the build's process environment — so a value set here would reach the
# worker and never reach the browser. Verified: a build with staging in [vars] and
# localhost in .env put localhost in dist/assets and staging only in
# dist/_worker.js.
#
# The four the console reads are therefore set as environment variables on the
# Pages project itself, for production and preview:
#
#   VITE_API_URL            https://staging.cosmolocal.credit
#   VITE_RELAYER_URL        https://staging.cosmolocal.credit/api/v2/relayer
#   VITE_CHAIN_ID           42220
#   VITE_RELYING_PARTY_ID   cosmolocal.credit
#
# VITE_RELYING_PARTY_ID is the registrable domain, not this host: a passkey is
# bound to the relying party it was registered under, so scoping it to the parent
# is what lets one credential work on app.cosmolocal.credit and
# admin.cosmolocal.credit alike. apps/web must carry the same value. A scheme is
# stripped by `new URL(value).hostname`, so https:// is optional here.
#
# The backend does not verify it — clc-core loads `relayer.relying_party_id` and
# never reads it; the assertion check compares `clientDataJSON.origin` against
# `relayer.allowed_origins`, which is where this console's origin must be added,
# scheme included.
#
# Adding maps later means adding VITE_MAPTILER_KEY here too, and allowing this
# origin on the key in the MapTiler account.
