# Cloudflare Pages project for the admin console on **prod** (Gnosis).
#
# See the header of the root wrangler.toml for why develop and master keep
# different copies of this file at the same path. This file and that one are
# the only two that must never be overwritten by a merge from develop, or this
# project (`clc-admin`) is renamed out from under itself.
#
# A separate project from apps/web on purpose. A Pages project has one build
# output directory, and serving the console from a path on the app's origin would
# put it inside the scope of apps/web's service worker — which must never cache or
# intercept anything here.
#
# The deploy is Git-connected, with these dashboard build settings:
#   Production branch        master
#   Root directory           apps/admin      <- must be this, not the repo root
#   Build command            pnpm build
#   Build output directory   dist
#
# The root directory is what makes the Pages platform read *this* file. Left at
# the repository root, the platform reads ../../wrangler.toml, takes
# `apps/web/dist` and apps/web's vars, and fails the deploy after an otherwise
# successful build with `Output directory "apps/web/dist" not found`.
#
# THIS FILE IS ALSO WHAT SEPARATES THE TWO PROJECTS AT BUILD TIME. Nitro resolves
# a Wrangler config from the build's working directory; delete this and the
# resolution walks up to the root config, generating a worker named "clc-app"
# carrying every one of apps/web's vars. Verified by building with and without it.
name = "clc-admin"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# Only the variables this app reads. Deliberately not copied wholesale from the
# web project: the console has no paper-wallet origin and no RPC, and it never
# *registers* a passkey — only asserts one — so it needs no relying-party name.
#
# VITE_STORAGE_URL is shared with apps/web: gnosis-storage.cosmolocal.credit.
# Its origin allowlist must include this console's hosts.
#
# VITE_MAPTILER_KEY is the same key apps/web uses. The account's allowed-origins
# list must include this console's hosts (admin.cosmolocal.credit and the
# pages.dev previews) or tiles 403 while everything else on the page works.
[vars]
VITE_API_URL = "https://api.cosmolocal.credit"
VITE_BRAND = "prod"
VITE_CHAIN_ID = "100"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"
VITE_RELAYER_URL = "https://api.cosmolocal.credit/api/v2/relayer"
VITE_STORAGE_URL = "https://gnosis-storage.cosmolocal.credit"
# The registrable domain, not this host: a passkey is bound to the relying party
# it was registered under, so scoping it to the parent is what lets one
# credential work on app.cosmolocal.credit and admin.cosmolocal.credit alike.
# apps/web carries the same value.
VITE_RELYING_PARTY_ID = "cosmolocal.credit"

# Preview deploys keep their own relying party. Every key is repeated because
# `vars` is non-inheritable.
[env.preview.vars]
VITE_API_URL = "https://api.cosmolocal.credit"
VITE_BRAND = "prod"
VITE_CHAIN_ID = "100"
VITE_MAPTILER_KEY = "HJ3ZCTfCnAxQ6EOKlSgl"
VITE_RELAYER_URL = "https://api.cosmolocal.credit/api/v2/relayer"
VITE_STORAGE_URL = "https://gnosis-storage.cosmolocal.credit"
VITE_RELYING_PARTY_ID = "clc-admin.pages.dev"
