name: Promotion safety

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  wrangler:
    name: Wrangler promotion safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check promotion guard regressions
        run: python3 -m unittest discover -s tooling -p 'check_promotion_test.py'

      - name: Check environment settings and the next promotion
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" = master ]; then
            python3 tooling/check_promotion.py --master HEAD --develop origin/develop
          else
            python3 tooling/check_promotion.py --master origin/master --develop HEAD
          fi
