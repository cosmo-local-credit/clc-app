name: E2E + Visual (Percy)

# Manual-only while E2E/Percy is disabled for CI.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to test (e.g. a Cloudflare preview deployment)"
        required: false
        default: "https://app.cosmolocal.credit"

jobs:
  e2e:
    name: Playwright + Percy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E tests with Percy
        run: pnpm --filter @clc/web test:e2e:percy
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://app.cosmolocal.credit' }}
