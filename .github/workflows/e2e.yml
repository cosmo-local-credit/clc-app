name: E2E (BrowserStack)

# Real-device e2e is heavier than unit tests, so it runs on demand and on PRs
# labelled "e2e" rather than on every push. Tests target a deployed build via
# BASE_URL (the live app by default, or a Cloudflare PR preview URL you pass in).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to test (e.g. a Cloudflare preview deployment)"
        required: false
        default: "https://app.cosmolocal.credit"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  browserstack:
    name: Playwright on BrowserStack
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers run remotely on BrowserStack; nothing to install locally.
      - name: Run e2e on BrowserStack
        run: pnpm --filter @clc/web test:e2e:bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://app.cosmolocal.credit' }}
          BUILD_NUMBER: ${{ github.run_number }}
