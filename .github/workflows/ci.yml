name: CI

# Contributors run checks locally before they commit. CI runs when a commit
# lands on develop or master. Pull requests do not run it; maintainers merge
# into develop, and that push is what starts the workflow.
on:
  push:
    branches: [master, develop]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Release milestones
        # Compares release.json with the branch's previous tip, which the
        # shallow checkout does not include.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          node tooling/check-release.ts "$BEFORE"

      - name: Lint
        run: vp check

      - name: Dead-code analysis — cycles
        run: vp run knip:cycles

      - name: Dead-code analysis
        run: vp run knip:ci

      - name: Dead-code report
        continue-on-error: true
        run: vp run knip:report | tail -n +2 >> "$GITHUB_STEP_SUMMARY"

      - name: Test (with coverage)
        run: vp test --coverage --passWithNoTests

      - name: Validate and partition coverage
        run: node tooling/prepare-coverage.ts

      - name: Build web bundle analysis
        run: vp build
        working-directory: apps/web
        env:
          CI: "true"
          # Compare production browser output across both branches. Staging's
          # deployment still keeps its full React errors and unminified client.
          VITE_FULL_REACT_ERRORS: "false"
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage — workspace
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage — core
        uses: codecov/codecov-action@v6
        with:
          files: coverage/core/lcov.info
          flags: core
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage — web
        uses: codecov/codecov-action@v6
        with:
          files: coverage/web/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
