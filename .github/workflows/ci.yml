name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test & Coverage
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Lint
        run: vp check

      - name: Dead-code analysis — cycles
        run: vp run knip:cycles

      - name: Dead-code analysis
        continue-on-error: true
        run: vp run knip:ci

      - name: Dead-code report
        continue-on-error: true
        run: vp run knip:report | tail -n +2 >> "$GITHUB_STEP_SUMMARY"

      - name: Test (with coverage)
        run: vp test --coverage --passWithNoTests

      - name: Build web bundle analysis
        run: vp build
        working-directory: apps/web
        env:
          CI: "true"
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage — core
        uses: codecov/codecov-action@v6
        with:
          files: packages/core/coverage/lcov.info
          flags: core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage — web
        uses: codecov/codecov-action@v6
        with:
          files: apps/web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
